# Keep terminal windows visually consistent without requiring app-specific rules.
windowrule = tag +terminal, match:class (Alacritty|kitty|com.mitchellh.ghostty|foot|org[.]desktop[.].*)
windowrule = tag -default-opacity, match:tag terminal
windowrule = opacity 0.985 0.96, match:tag terminal

# Walker is a layer surface, so it should appear without compositor animation.
layerrule = no_anim on, match:namespace walker
