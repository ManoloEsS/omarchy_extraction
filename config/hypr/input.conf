input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options = compose:caps
  kb_rules =

  follow_mouse = 1
  sensitivity = 0

  repeat_rate = 40
  repeat_delay = 250
  numlock_by_default = true

  touchpad {
    natural_scroll = false
    clickfinger_behavior = true
    scroll_factor = 0.4
  }
}

# Make touchpad scrolling in terminals less sluggish.
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 1.5
