# Volume and display brightness with SwayOSD.
bindeld = , XF86AudioRaiseVolume, Volume up, exec, desk-swayosd-client --output-volume raise
bindeld = , XF86AudioLowerVolume, Volume down, exec, desk-swayosd-client --output-volume lower
bindeld = , XF86AudioMute, Mute, exec, desk-swayosd-client --output-volume mute-toggle
bindeld = , XF86AudioMicMute, Mute microphone, exec, desk-audio-input-mute
bindeld = , XF86MonBrightnessUp, Brightness up, exec, desk-brightness-display +5%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, desk-brightness-display 5%-
bindeld = SHIFT, XF86MonBrightnessUp, Brightness maximum, exec, desk-brightness-display 100%
bindeld = SHIFT, XF86MonBrightnessDown, Brightness minimum, exec, desk-brightness-display 1%
bindld = , XF86KbdBrightnessUp, Keyboard brightness up, exec, desk-brightness-keyboard up
bindld = , XF86KbdBrightnessDown, Keyboard brightness down, exec, desk-brightness-keyboard down
bindld = , XF86KbdLightOnOff, Keyboard backlight cycle, exec, desk-brightness-keyboard cycle

# Precise one-percent adjustments.
bindeld = ALT, XF86AudioRaiseVolume, Volume up precise, exec, desk-swayosd-client --output-volume +1
bindeld = ALT, XF86AudioLowerVolume, Volume down precise, exec, desk-swayosd-client --output-volume -1
bindeld = ALT, XF86MonBrightnessUp, Brightness up precise, exec, desk-brightness-display +1%
bindeld = ALT, XF86MonBrightnessDown, Brightness down precise, exec, desk-brightness-display 1%-

# Media playback.
bindld = , XF86AudioNext, Next track, exec, desk-swayosd-client --playerctl next
bindld = , XF86AudioPause, Pause, exec, desk-swayosd-client --playerctl play-pause
bindld = , XF86AudioPlay, Play, exec, desk-swayosd-client --playerctl play-pause
bindld = , XF86AudioPrev, Previous track, exec, desk-swayosd-client --playerctl previous
bindld = SUPER, XF86AudioMute, Switch audio output, exec, desk-audio-output-switch
