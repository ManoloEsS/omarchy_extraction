# Launcher and small system menu.
bindd = SUPER, SPACE, Launch apps, exec, desk-launch-walker
bindd = SUPER CTRL, E, Symbols, exec, desk-launch-walker -m symbols
bindd = SUPER ALT, SPACE, System menu, exec, desk-menu
bindd = SUPER ESCAPE, System menu, exec, desk-menu
bindld = , XF86PowerOff, System menu, exec, desk-menu power

# Desktop toggles.
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, desk-toggle-waybar
bindd = SUPER CTRL, I, Toggle idle lock, exec, desk-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, desk-toggle-nightlight
bindd = SUPER CTRL, COMMA, Toggle notifications, exec, desk-toggle-notifications

# Notifications.
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Capture and color picking.
bindd = , PRINT, Screenshot, exec, desk-screenshot
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a

# Control panels.
bindd = SUPER CTRL, A, Audio controls, exec, desk-launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, desk-launch-bluetooth
bindd = SUPER CTRL, W, Wi-Fi controls, exec, desk-launch-wifi
bindd = SUPER CTRL, T, Activity, exec, desk-launch-or-focus-tui btop

# Zoom and lock.
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1
bindd = SUPER CTRL, L, Lock system, exec, desk-lock
