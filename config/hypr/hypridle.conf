general {
  lock_cmd = pidof hyprlock || desk-lock
  before_sleep_cmd = desk-lock
  after_sleep_cmd = hyprctl dispatch dpms on
  inhibit_sleep = 3
}

# Lock after five minutes of inactivity.
listener {
  timeout = 300
  on-timeout = desk-lock
}

# Turn off displays shortly after locking.
listener {
  timeout = 330
  on-timeout = hyprctl dispatch dpms off
  on-resume = hyprctl dispatch dpms on
}
